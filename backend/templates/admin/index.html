{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main">
  <div class="kuku-stats">
    {% for label, count, url in kuku_stats %}
    <a class="kuku-stat" href="{{ url }}">
      <strong>{{ count }}</strong>
      <span>{{ label }}</span>
    </a>
    {% endfor %}
  </div>
  {% include "admin/app_list.html" with app_list=app_list show_changelinks=True %}
</div>
{% endblock %}
